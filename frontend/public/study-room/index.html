<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室 · 专注</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app">
        <!-- 顶部栏 -->
        <header class="topbar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>自习室</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="fullscreen-btn" title="全屏 (F)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>
                <button class="icon-btn" id="settings-btn" title="设置">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容 -->
        <div class="main">
            <!-- 计时器 -->
            <section class="timer-card mode-focus" id="timer-card">
                <div class="mode-tabs">
                    <button class="mode-tab active" data-mode="focus">专注</button>
                    <button class="mode-tab" data-mode="short">短休</button>
                    <button class="mode-tab" data-mode="long">长休</button>
                </div>
                <div class="time-display" id="time-display">25:00</div>
                <div class="status-text" id="status-text">准备开始</div>
                <div class="controls">
                    <button class="btn btn-primary" id="start-btn">开始专注</button>
                    <button class="btn btn-secondary" id="reset-btn">重置</button>
                </div>
                <div class="cycle-indicator">
                    <span>今日周期</span>
                    <div class="dots" id="dots"></div>
                    <span id="cycle-count">0/4</span>
                </div>
            </section>

            <!-- 侧栏 -->
            <aside class="sidebar" id="sidebar">
                <!-- 待办 -->
                <div class="card">
                    <h3>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        待办事项 <span id="todo-count">0</span>
                    </h3>
                    <div class="todo-input-row">
                        <input type="text" class="todo-input" id="todo-input" placeholder="添加任务..." maxlength="200">
                        <button class="todo-add-btn" id="todo-add-btn">添加</button>
                    </div>
                    <ul class="todo-list" id="todo-list"></ul>
                    <button class="todo-clear-btn" id="todo-clear-btn" style="display:none;">清除已完成</button>
                </div>

                <!-- 白噪音 -->
                <div class="card">
                    <h3>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
                        白噪音
                    </h3>
                    <div class="sound-grid">
                        <button class="sound-btn" data-sound="rain">雨声</button>
                        <button class="sound-btn" data-sound="forest">森林</button>
                        <button class="sound-btn" data-sound="deep">深海</button>
                        <button class="sound-btn active" data-sound="off">静音</button>
                    </div>
                    <div class="volume-row">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                        <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="30">
                    </div>
                </div>

                <!-- 统计 -->
                <div class="card">
                    <h3>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                        今日统计
                    </h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="stat-sessions">0</div>
                            <div class="stat-label">专注</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-minutes">0</div>
                            <div class="stat-label">分钟</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="stat-streak">0</div>
                            <div class="stat-label">连续</div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 底部引用 -->
        <footer class="footer" id="quote">"学如逆水行舟，不进则退。"</footer>
    </div>

    <!-- 设置模态框 -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2>设置</h2>
            <div class="form-group">
                <label>专注时长（分钟）</label>
                <input type="number" id="set-focus" min="1" max="120" value="25">
            </div>
            <div class="form-group">
                <label>短休息时长（分钟）</label>
                <input type="number" id="set-short" min="1" max="60" value="5">
            </div>
            <div class="form-group">
                <label>长休息时长（分钟）</label>
                <input type="number" id="set-long" min="1" max="60" value="15">
            </div>
            <div class="form-group">
                <label>长休息间隔（专注次数）</label>
                <input type="number" id="set-interval" min="2" max="8" value="4">
            </div>
            <div class="form-group toggle-row">
                <span>自动开始下一个阶段</span>
                <button class="toggle-switch" id="set-auto-start"></button>
            </div>
            <div class="form-group toggle-row">
                <span>立体声（关 = 单声道居中）</span>
                <button class="toggle-switch" id="set-stereo"></button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modal-cancel">取消</button>
                <button class="btn btn-primary" id="modal-save">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast容器 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 按顺序加载脚本 -->
    <script src="js/config.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
